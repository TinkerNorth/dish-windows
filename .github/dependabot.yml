version: 2
updates:
  # One PR per week for every action bump together: the bumps are independent
  # one-liners, and with "require branches to be up to date" on main, N
  # separate PRs cost N full CI cycles.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # The builtin-baseline in vcpkg.json, the one copy of the vcpkg pin (the
  # workflows read it from there). A baseline bump moves every port at once,
  # so its PR fails scripts/check-versions.ps1 until THIRD_PARTY.md and
  # assets/licenses/licenses.json name what the new baseline resolves.
  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      vcpkg:
        update-types:
          - "minor"
          - "patch"
