version: 2
updates:
  # One PR per week for every action bump together: the bumps are independent
  # one-liners, and with "require branches to be up to date" on main, N
  # separate PRs cost N full CI cycles.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

