name: Version consistency

# A PR-time text-consistency gate, not a build. scripts/check-versions.ps1
# holds every rule (its header lists each source of truth and its copies: the
# app version, the vcpkg baseline and what it resolves, the FetchContent pins,
# the tool pins in scripts/tools.ps1, the protocol number); scripts/ci-local.ps1
# runs the same script. release.yml keeps its own check: only it can compare
# the tag and the built dish.exe.

on:
  push:
    branches: [main]
    paths: &version-paths
      - CMakeLists.txt
      - CHANGELOG.md
      - CONTRIBUTING.md
      - THIRD_PARTY.md
      - assets/licenses/licenses.json
      - docs/contract.md
      - packaging/dish.rc
      - src/core/model/Protocol.h
      - tests/CMakeLists.txt
      - vcpkg.json
      - scripts/tools.ps1
      - scripts/check-versions.ps1
      - .github/pull_request_template.md
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths: *version-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Versions, pins and documented facts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every copy with its source
        shell: pwsh
        run: ./scripts/check-versions.ps1
