name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-2022
    # Back down from 120. That cap existed because the Build step used to run
    # configure inside the traced region, so vcpkg's dependency builds were
    # compiled under CodeQL's tracer (OpenSSL alone: 40 min traced against ~7
    # untraced). Configure now runs before init and the tracer sees only
    # first-party compiles; a warm binary cache lands the whole job around
    # 25 min and a cold one around 35, so 60 catches a hang with margin.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [cpp]

    env:
      VCPKG_COMMITID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QT_VERSION: "6.7.3"
      # Job-level so lukka/run-vcpkg sees it already defined and leaves it
      # alone: its default (clear;x-gha,readwrite) has never restored a
      # package here, so every run rebuilt OpenSSL from source. The files
      # provider is backed by the actions/cache step below; windows-ci.yml
      # uses the same key, so the two lanes share archives.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
      # Overlay (incremental) analysis needs build-mode none; this lane traces
      # a real MSVC build, so the action would try, warn that it cannot, and
      # fall back to a full database on every run. Declaring the mode it ends
      # up in anyway keeps the init step's log clean.
      CODEQL_OVERLAY_DATABASE_MODE: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""
          cache: true

      # ImageVersion is in the cache key because a runner-image update can
      # carry a new MSVC, which changes vcpkg's ABI hashes: under a fixed key
      # the cache would go permanently stale — restored but never hit, rebuilt
      # but never saved, since actions/cache does not update an existing key.
      # The directory must exist before vcpkg first writes into it.
      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          Add-Content $env:GITHUB_ENV "IMAGE_VERSION=$env:ImageVersion"

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ env.VCPKG_COMMITID }}-${{ hashFiles('vcpkg.json') }}
          # A pin or manifest bump still restores the previous archives: vcpkg
          # keys each package by ABI hash, skips what no longer matches, and
          # rebuilds only the delta, saved under the new key.
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMITID }}

      # Deliberately BEFORE CodeQL init: configure is where the vcpkg
      # toolchain builds or restores the dependencies, and the tracer has no
      # business watching that. Traced, the dependency builds cost ~48 min of
      # a 60 min Build step and pushed third-party TUs into the database for
      # the analyse step to chew on; their headers still reach the database
      # through the includes of traced first-party compiles.
      #
      # The flags live in CMakePresets.json (preset release), shared with
      # windows-ci.yml and release.yml. Two deliberate deltas against the old
      # inline configure: the tree is build-release (the preset's binaryDir)
      # and DISH_REQUIRE_TRANSLATIONS is ON, which this lane's Qt install
      # already satisfies (same install-qt-action as windows-ci.yml).
      - name: Configure (vcpkg dependencies build untraced)
        shell: pwsh
        run: cmake --preset release

      # init and analyze come from the same repo — bump both SHAs together.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # security-extended without security-and-quality: the quality suite
          # tripled the query count for maintainability findings.
          queries: security-extended

      # 4 = the windows-2022 runner's vCPU count; Ninja's cores+2 default
      # only oversubscribes it. Direct --build on the preset's binaryDir with
      # an explicit --target: the tracer wants exactly Dish, not the release
      # build preset's Dish + dish_setup_image pair.
      - name: Build (traced)
        shell: pwsh
        run: cmake --build build-release --parallel 4 --target Dish

      # Blocking, and the SARIF is uploaded: the repository is public, so code
      # scanning is available and the findings land as alerts instead of only
      # in this log.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
