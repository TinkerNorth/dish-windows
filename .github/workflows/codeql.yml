name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-2022
    # 60 was not enough once the Moonlight path landed. CodeQL traces the
    # compiler, which costs several times a plain build, and the Build step
    # alone grew to ~57 min against ~36 min for the whole run on main — the
    # analyse step was reaching the cap with seconds to spare and the job was
    # cancelled, which reads as a failed check even though `analyze` is
    # continue-on-error. This is the traced build being slow, not a hang, so
    # the cap is raised rather than the work cut.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [cpp]

    env:
      VCPKG_COMMITID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QT_VERSION: "6.7.3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""
          cache: true

      - name: Set up vcpkg + install dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMITID }}

      # init and analyze come from the same repo — bump both SHAs together.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # Keeps vendored FetchContent sources (ENet, Catch2) out of the
          # analysis; see the file for why.
          config-file: ./.github/codeql-config.yml

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDISH_BUILD_TESTS=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          # 4 = the windows-2022 runner's vCPU count; Ninja's cores+2 default
          # only oversubscribes it.
          cmake --build build --parallel 4 --target Dish

      - name: Perform CodeQL analysis
        # SARIF upload needs Advanced Security, which a private repo does not
        # have. Findings still surface in the logs. Drop continue-on-error and
        # `upload: failure-only` once the repo is public.
        continue-on-error: true
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
          upload: failure-only
