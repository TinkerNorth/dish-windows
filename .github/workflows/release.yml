name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Builds a release dish.exe + Qt runtime bundle, SBOM and checksums, and
# attaches them to the GitHub Release for the tag.
#
# No signing or provenance attestation yet; the artifacts are unsigned.

# Read-only by default; only the job that publishes gets contents: write.
# No id-token / attestations scope — nothing signs or attests here, and an
# unused write scope on every job is just a wider blast radius.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    # Must be a superset of what _security.yml declares, or the call fails.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: false
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  release:
    name: Build Windows release
    needs: [gates]
    runs-on: windows-2022
    timeout-minutes: 60

    # The only job that needs to write: it creates the GitHub Release.
    permissions:
      contents: write

    env:
      VCPKG_COMMITID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QT_VERSION: "6.7.3"

    steps:
      # On a tag push this resolves to the empty string and checkout takes
      # github.ref, which is already the tag. On workflow_dispatch it is the
      # tag the operator typed — without this the dispatch path silently built
      # the default branch and labelled the result a release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""
          cache: true

      - name: Set up vcpkg + install dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMITID }}

      - name: Configure (Release)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDISH_BUILD_TESTS=OFF `
            -DDISH_REQUIRE_TRANSLATIONS=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      # 4 = the windows-2022 runner's vCPU count; Ninja's cores+2 default
      # only oversubscribes it.
      # dish_setup_image stages the install image (windeployqt + the app-local
      # CRT + licences) that the Inno Setup step below ships verbatim.
      - name: Build
        run: cmake --build build --parallel 4 --target Dish dish_setup_image

      - name: Bundle Qt runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dish-windows | Out-Null
          Copy-Item build/dish.exe dish-windows/
          # windeployqt walks Qt's dependency graph only. dish.exe imports
          # libsodium.dll and SDL2.dll directly (vcpkg staged them beside the
          # exe at link time), so without this copy the zip ships a dish.exe
          # that cannot start: 0xc0000135, no window, no message.
          Copy-Item build/libsodium.dll, build/SDL2.dll dish-windows/
          # --qmldir is required: the Quick chrome is the only UI, so a bundle
          # without the QML modules opens to a white window.
          # install-qt-action v4 sets QT_ROOT_DIR but not Qt6_DIR.
          #
          # --no-compiler-runtime, with the five CRT DLLs staged by hand below:
          # windeployqt's idea of deploying the VC++ runtime is to drop
          # vc_redist.x64.exe beside the app, and that is an INSTALLER, not a
          # runtime. A "portable" zip whose exe only starts once the user has
          # found and run a 25 MB redist buried inside it is not portable, and
          # nothing prompts them to — the failure is a silent 0xc0000135.
          # cmake/DishSetupImage.cmake section 6 makes the same call for the
          # install image, with the same five files.
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-compiler-runtime --qmldir src/qml dish-windows/dish.exe
          # dish.exe imports MSVCP140, VCRUNTIME140 and VCRUNTIME140_1 directly,
          # and Qt6Core drags MSVCP140_1 and MSVCP140_2 in behind it — all five
          # confirmed with dumpbin /DEPENDENTS and against the loaded-module list
          # of the staged app while it ran. Deployed without them the zip works
          # only on a machine that already has the redistributable installed,
          # which a fresh Windows does not.
          #
          # VCToolsRedistDir comes from the MSVC environment step above. The
          # install image treats its absence as fatal; so does this, because the
          # alternative is a bundle that silently borrows System32 on the runner
          # and dies on the first machine without it.
          if (-not $env:VCToolsRedistDir) { throw 'VCToolsRedistDir is not set: the MSVC environment step did not run, and the bundle cannot ship an app-local CRT' }
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path $crt $dll))) { throw "Missing $dll in $crt" }
            Copy-Item (Join-Path $crt $dll) dish-windows/
          }
          # The app's OWN QML module entry, which windeployqt cannot know about:
          # --qmldir scans imports and deploys the QT modules they resolve to,
          # and Dish.Chrome is not one of Qt's. dish.exe carries a compiled-in
          # copy, but Qt searches <exedir>/Dish/Chrome/qmldir BEFORE it, so the
          # file that ships had better be the app's own. It is only the module
          # ENTRY: the `prefer` line inside sends every type to the compiled-in
          # copy, so no .qml source ships.
          #
          # The two asserts fail the release, named, if the build ever stops
          # generating a qmldir that declares the app's Main type, instead of
          # letting a bundle nobody launched go out.
          # cmake/DishSetupImage.cmake section 3 stages and checks the same file.
          $qmldir = 'build/Dish/Chrome/qmldir'
          if (-not (Test-Path $qmldir)) { throw "No Dish.Chrome qmldir at $qmldir - the bundled dish.exe could not resolve its own QML module" }
          if ((Get-Content $qmldir -Raw) -notmatch '(?m)^Main 1\.0 ') { throw "$qmldir does not declare the app's Main type, so it is the wrong Dish.Chrome qmldir (the setup kit's?)" }
          New-Item -ItemType Directory -Force -Path dish-windows/Dish/Chrome | Out-Null
          Copy-Item $qmldir dish-windows/Dish/Chrome/

      # Nothing had ever launched the portable bundle. It shipped for two
      # releases unable to start (the Dish.Chrome qmldir above), which no unit
      # test, no lint and no installer round-trip can see: they all run against
      # the build tree, and the build tree is exactly what hides it. This runs
      # the staged bundle, from a copy somewhere else, and fails the release if
      # it does not stay up.
      - name: Portable bundle smoke test (it must start)
        shell: pwsh
        run: ./scripts/test-portable-bundle.ps1 -Bundle dish-windows

      # LGPLv3 s4(b) requires the licence to travel with the Combined Work, and
      # Qt is linked under it. OFL-1.1 s2 requires the same for the four Inter
      # faces compiled into the exe as Qt resources. Without these the zip is
      # not redistributable.
      - name: Stage licence texts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dish-windows/licenses | Out-Null
          Copy-Item LICENSE            dish-windows/licenses/LICENSE.LGPL-3.0.txt
          Copy-Item COPYING.GPL3       dish-windows/licenses/LICENSE.GPL-3.0.txt
          Copy-Item THIRD_PARTY.md     dish-windows/licenses/
          Copy-Item packaging/fonts/Inter-LICENSE.txt dish-windows/licenses/
          Get-ChildItem dish-windows/licenses

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      # Beside the zip, not inside it: dish-setup.exe is a release asset in its
      # own right, and the portable bundle stays exactly what it was. The
      # version is stamped from the tag via /D, so the setup exe, the payload
      # and latest.json agree; the earlier version asserts already proved the
      # tag matches project(Dish VERSION ...) and the built dish.exe.
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $num = ($tag -replace '^v','') -replace '[-+].*$',''
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$num" "/DImageDir=build\setup-image" installer.iss
          if (-not (Test-Path 'dist/dish-setup.exe')) { throw 'iscc did not produce dist/dish-setup.exe' }
          Copy-Item dist/dish-setup.exe "$PWD/dish-setup.exe"

      # The same assertions windows-ci runs, against the artifact that is about
      # to be published rather than a rebuild of it.
      - name: Installer silent round-trip (no UI)
        shell: pwsh
        run: ./scripts/test-installer-roundtrip.ps1 -Setup ./dish-setup.exe

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dish-windows
          format: spdx-json
          artifact-name: dish-windows-sbom.spdx.json
          output-file: dish-windows.spdx.json
          # Off because the action's attach path re-downloads its own artifact
          # over the REST API, which needs an actions: read scope this job
          # deliberately does not grant ("Resource not accessible by
          # integration"). Redundant anyway: the publish step below ships
          # dish-windows.spdx.json as a release asset, unzipped and covered by
          # SHA256SUMS, which the action's zipped attach is neither.
          upload-release-assets: false

      # Manifest of the bundle's contents, shipped inside the zip. Paths are
      # relative to the bundle root: windeployqt lays plugins out in
      # subdirectories (platforms/, imageformats/, styles/) and basenames alone
      # both lose that and can collide.
      #
      # Written as LF with no BOM. `Out-File -Encoding ascii` emits CRLF, which
      # GNU coreutils `sha256sum -c` rejects as "no properly formatted
      # checksum lines" — the manifest has to verify off Windows too.
      - name: Compute bundle SHA256SUMS
        shell: pwsh
        run: |
          $root = (Resolve-Path dish-windows).Path
          $lines = Get-ChildItem dish-windows -Recurse -File | ForEach-Object {
            $rel = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $rel"
          }
          [IO.File]::WriteAllText("$root/SHA256SUMS", ($lines -join "`n") + "`n", (New-Object Text.UTF8Encoding $false))

      - name: Zip release bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dish-windows/* -DestinationPath dish-windows.zip -Force

      # Auto-update manifest, fetched by dish.exe from the stable permalink
      # releases/latest/download/latest.json. Ships with EVERY release; the
      # asset name never changes. The two version asserts prevent the fatal
      # drift where the shipped exe self-reports an older version than the
      # manifest and every client re-applies forever.
      - name: Emit update manifest (latest.json)
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Tag '$tag' is not vMAJOR.MINOR.PATCH" }
          $version = $tag.Substring(1)
          $cm = Get-Content CMakeLists.txt -Raw
          if ($cm -notmatch 'project\(\s*Dish[\s\r\n]+VERSION[\s]+(\d+\.\d+\.\d+)') { throw 'project VERSION not found' }
          if ($Matches[1] -ne $version) { throw "Tag $tag but project VERSION is $($Matches[1])" }
          $exeVersion = (Get-Item dish-windows/dish.exe).VersionInfo.ProductVersion
          if ($exeVersion -notlike "$version*") { throw "dish.exe reports '$exeVersion' but the tag says '$version' (packaging/dish.rc out of step)" }
          $minSupported = (Get-Content packaging/update-policy.json -Raw | ConvertFrom-Json).minimumSupportedVersion
          if ($minSupported -notmatch '^\d+\.\d+\.\d+$') { throw 'update-policy.json minimumSupportedVersion malformed' }
          $assets = [ordered]@{}
          foreach ($name in @('dish-setup.exe','dish-windows.zip')) {
            $f = Get-Item $name
            $assets[$name] = [ordered]@{
              url    = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
              sha256 = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              size   = $f.Length
            }
          }
          $m = [ordered]@{
            schema = 1; product = 'dish-windows'; version = $version; channel = 'stable'
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
            minimumSupportedVersion = $minSupported
            releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
            assets = $assets
          }
          $json = ($m | ConvertTo-Json -Depth 4) -replace "`r`n", "`n"
          [IO.File]::WriteAllText("$PWD/latest.json", $json + "`n", (New-Object Text.UTF8Encoding $false))
          Get-Content latest.json

      # The manifest above is inside the zip, so it cannot attest to the zip.
      # This one covers the artifacts a person actually downloads, and is what
      # the release page's "verify your download" instructions point at.
      - name: Compute release-asset SHA256SUMS
        shell: pwsh
        run: |
          $lines = Get-ChildItem dish-windows.zip, dish-windows.spdx.json, dish-setup.exe, latest.json | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($lines -join "`n") + "`n", (New-Object Text.UTF8Encoding $false))
          Get-Content SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dish-windows-x86_64
          path: |
            dish-windows.zip
            dish-windows.spdx.json
            dish-setup.exe
            latest.json
            SHA256SUMS
          retention-days: 30

      # Publishes on both triggers. `tag_name` is explicit because on
      # workflow_dispatch github.ref is the default branch, not the tag that
      # was built, and action-gh-release would otherwise create a release
      # against the branch ref.
      #
      # draft: true is load-bearing. GitHub never points releases/latest at a
      # draft, so the assets upload while the update permalink still resolves
      # to the previous release; the flip below is what makes publication
      # atomic for every client polling latest.json.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dish-windows.zip
            dish-windows.spdx.json
            dish-setup.exe
            latest.json
            SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true

      # Assets upload while the release is a draft (drafts are never 'latest');
      # flipping afterwards makes the publish atomic for the update permalink.
      # gh is preinstalled on windows-2022, so this adds no action to pin.
      - name: Flip release from draft to published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit '${{ github.event.inputs.tag || github.ref_name }}' --draft=false
          $draft = gh release view '${{ github.event.inputs.tag || github.ref_name }}' --json isDraft --jq .isDraft
          if ($draft -ne 'false') { throw 'release is still a draft' }
