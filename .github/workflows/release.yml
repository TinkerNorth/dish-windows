name: Release

on:
  push:
    # Bare MAJOR.MINOR.PATCH tags, no v prefix (org convention for the
    # product repos: dish-android's pipeline requires bare tags). The
    # manifest step below still hard-gates the exact format; this glob only
    # has to be close, and every consumer tolerates a legacy v by stripping.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Builds a release dish.exe + Qt runtime bundle, proves both the portable
# bundle and the installer against a real disk and registry, then hands the
# artifacts to the shared harden workflow (Grype scan, SPDX + CycloneDX SBOMs,
# SHA256SUMS, cosign keyless signatures) and the SLSA L3 provenance generator
# before publishing.
#
# Authenticode signing is advisory-by-default: dish-setup.exe is signed when
# WIN_SIGN_CERT_BASE64 + WIN_SIGN_PASSWORD exist, and the release proceeds
# unsigned (with a loud warning) when they don't. Set the repository variable
# ENFORCE_RELEASE_SIGNING=true to make missing secrets fail a stable tag.
# Asset names never change either way; latest.json's stable-name contract
# with shipped clients forbids an -unsigned suffix here.
#
# The release is uploaded as a DRAFT and flipped to published afterwards:
# GitHub never points releases/latest at a draft, so the assets upload while
# the update permalink still resolves to the previous release; the flip is
# what makes publication atomic for every client polling latest.json.
#
# Prerelease tags (1.2.3-rc.1) publish marked as prerelease and skip
# latest.json; stable clients never see them.
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout                @ v7.0.1  → 3d3c42e5aac5ba805825da76410c181273ba90b1
#   ilammy/msvc-dev-cmd             @ v1.13.0 → 0b201ec74fa43914dc39ae48a89fd1d8cb592756
#   jurplel/install-qt-action       @ v4.3.1  → 48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
#   lukka/run-vcpkg                 @ v11.5   → 5e0cab206a5ea620130caf672fce3e4a6b5666a1
#   actions/upload-artifact         @ v7.0.1  → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact       @ v8.0.1  → 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   softprops/action-gh-release     @ v3.0.2  → 3d0d9888cb7fd7b750713d6e236d1fcb99157228
#   slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml
#                                   @ v2.1.0  → f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
#   (scan/SBOM/cosign pins live in _release_harden.yml)

# Read-only by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    # Must be a superset of what _security.yml declares, or the call fails.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: false
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  # ─────────────────────────────────────────────────────────────────────
  # Signing-secret report. Advisory by default: a missing Authenticode cert
  # downgrades the release to unsigned binaries rather than failing it. Set
  # the repository variable ENFORCE_RELEASE_SIGNING=true to restore the hard
  # gate once a certificate exists.
  # ─────────────────────────────────────────────────────────────────────
  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify Authenticode signing secrets for tagged releases
        env:
          ENFORCE: ${{ vars.ENFORCE_RELEASE_SIGNING }}
          WIN_SIGN_CERT_BASE64: ${{ secrets.WIN_SIGN_CERT_BASE64 }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in WIN_SIGN_CERT_BASE64 WIN_SIGN_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "::notice::Authenticode signing secrets present; dish-setup.exe will be signed."
            exit 0
          fi

          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::notice::Non-tag release run; unsigned fallback permitted. Missing: ${missing[*]}"
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "::warning::Prerelease tag ${GITHUB_REF_NAME}: artifacts will be unsigned. Missing: ${missing[*]}"
              exit 0
              ;;
          esac

          if [ "${ENFORCE:-}" = "true" ]; then
            echo "::error::Stable tagged release requires Authenticode signing secrets, but the following are missing: ${missing[*]}"
            echo "::error::Add the missing repository secrets, or unset the ENFORCE_RELEASE_SIGNING repository variable to allow unsigned artifacts."
            exit 1
          fi

          echo "::warning::Stable tag ${GITHUB_REF_NAME} is being released with an UNSIGNED installer. Missing: ${missing[*]}"
          echo "::warning::SmartScreen will warn users until a certificate is configured. Set ENFORCE_RELEASE_SIGNING=true to make this a hard failure once one exists."

  release:
    name: Build Windows release
    needs: [gates, required-secrets]
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      VCPKG_COMMITID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QT_VERSION: "6.7.3"
      WIN_SIGN_CERT_BASE64: ${{ secrets.WIN_SIGN_CERT_BASE64 }}

    steps:
      # On a tag push this resolves to the empty string and checkout takes
      # github.ref, which is already the tag. On workflow_dispatch it is the
      # tag the operator typed — without this the dispatch path silently built
      # the default branch and labelled the result a release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""
          cache: true

      - name: Set up vcpkg + install dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMITID }}

      # The configure line lives in CMakePresets.json (preset release, tree
      # build-release), shared with windows-ci.yml, codeql.yml and the local
      # scripts.
      - name: Configure (Release)
        shell: pwsh
        env:
          # Empty for anything but a release from this repo: secrets are not
          # exposed to forks, so a fork build carries no DSN and cannot upload.
          DISH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: cmake --preset release -DDISH_SENTRY_DSN="$env:DISH_SENTRY_DSN"

      # 4 = the windows-2022 runner's vCPU count; Ninja's cores+2 default
      # only oversubscribes it.
      # The release build preset carries the Dish + dish_setup_image targets:
      # dish_setup_image stages the install image (windeployqt + the app-local
      # CRT + licences) that the Inno Setup step below ships verbatim.
      - name: Build
        run: cmake --build --preset release --parallel 4

      # One staging path for this zip payload and windows-ci.yml's artifact:
      # scripts/stage-bundle.ps1 (exe, the four directly-imported DLLs,
      # windeployqt, app-local CRT, Dish.Chrome qmldir, licence texts). The
      # two lanes used to stage by hand and drifted: this zip shipped WITHOUT
      # libcrypto-3-x64.dll, which dish.exe imports directly for the
      # Moonlight crypto. The portable smoke test below never caught it
      # because GitHub runners carry a libcrypto-3-x64.dll on PATH (Strawberry
      # Perl), so the staged exe silently borrowed the runner's copy and the
      # shipped zip could not start on a clean machine.
      - name: Bundle Qt runtime DLLs
        shell: pwsh
        run: ./scripts/stage-bundle.ps1 -BuildDir build-release -OutDir dish-windows

      # Nothing had ever launched the portable bundle. It shipped for two
      # releases unable to start (the Dish.Chrome qmldir above), which no unit
      # test, no lint and no installer round-trip can see: they all run against
      # the build tree, and the build tree is exactly what hides it. This runs
      # the staged bundle, from a copy somewhere else, and fails the release if
      # it does not stay up.
      - name: Portable bundle smoke test (it must start)
        shell: pwsh
        run: ./scripts/test-portable-bundle.ps1 -Bundle dish-windows

      # Licence texts (LGPLv3 s4(b), OFL-1.1 s2) are staged by
      # scripts/stage-bundle.ps1 above.

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      # Beside the zip, not inside it: dish-setup.exe is a release asset in its
      # own right, and the portable bundle stays exactly what it was. The
      # version is stamped from the tag via /D, so the setup exe, the payload
      # and latest.json agree; the version asserts below prove the tag matches
      # project(Dish VERSION ...) and the built dish.exe.
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $num = ($tag -replace '^v','') -replace '[-+].*$',''
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$num" "/DImageDir=build-release\setup-image" installer.iss
          if (-not (Test-Path 'dist/dish-setup.exe')) { throw 'iscc did not produce dist/dish-setup.exe' }
          Copy-Item dist/dish-setup.exe "$PWD/dish-setup.exe"

      # Ported from satellite's release pipeline: sign when the cert exists,
      # release unsigned (with the required-secrets warning) when it doesn't.
      # Runs BEFORE the round-trip so the bytes we test are the bytes we ship.
      - name: Sign installer (if cert configured)
        if: ${{ env.WIN_SIGN_CERT_BASE64 != '' }}
        env:
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "code-sign.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WIN_SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe not found under Windows Kits" }
          & $signtool.FullName sign /f $cert /p $env:WIN_SIGN_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            ./dish-setup.exe

      # The same assertions windows-ci runs, against the artifact that is about
      # to be published rather than a rebuild of it.
      - name: Installer silent round-trip (no UI)
        shell: pwsh
        run: ./scripts/test-installer-roundtrip.ps1 -Setup ./dish-setup.exe

      # Manifest of the bundle's contents, shipped inside the zip. Paths are
      # relative to the bundle root: windeployqt lays plugins out in
      # subdirectories (platforms/, imageformats/, styles/) and basenames alone
      # both lose that and can collide.
      #
      # Written as LF with no BOM. `Out-File -Encoding ascii` emits CRLF, which
      # GNU coreutils `sha256sum -c` rejects as "no properly formatted
      # checksum lines" — the manifest has to verify off Windows too.
      - name: Compute bundle SHA256SUMS
        shell: pwsh
        run: |
          $root = (Resolve-Path dish-windows).Path
          $lines = Get-ChildItem dish-windows -Recurse -File | ForEach-Object {
            $rel = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $rel"
          }
          [IO.File]::WriteAllText("$root/SHA256SUMS", ($lines -join "`n") + "`n", (New-Object Text.UTF8Encoding $false))

      - name: Zip release bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dish-windows/* -DestinationPath dish-windows.zip -Force

      # Auto-update manifest, fetched by dish.exe from the stable permalink
      # releases/latest/download/latest.json. Ships with every STABLE release;
      # the asset name never changes. A prerelease tag emits nothing, so the
      # permalink keeps serving stable clients the last stable release. The
      # two version asserts prevent the fatal drift where the shipped exe
      # self-reports an older version than the manifest and every client
      # re-applies forever.
      - name: Emit update manifest (latest.json, stable tags only)
        id: manifest
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $bare = $tag -replace '^v',''
          if ($bare -match '-') {
            Write-Host "::notice::Prerelease tag ${tag}: skipping latest.json"
            "stable=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
            exit 0
          }
          if ($bare -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Tag '$tag' is not MAJOR.MINOR.PATCH[-prerelease]" }
          $version = $bare
          $cm = Get-Content CMakeLists.txt -Raw
          if ($cm -notmatch 'project\(\s*Dish[\s\r\n]+VERSION[\s]+(\d+\.\d+\.\d+)') { throw 'project VERSION not found' }
          if ($Matches[1] -ne $version) { throw "Tag $tag but project VERSION is $($Matches[1])" }
          $exeVersion = (Get-Item dish-windows/dish.exe).VersionInfo.ProductVersion
          if ($exeVersion -notlike "$version*") { throw "dish.exe reports '$exeVersion' but the tag says '$version' (packaging/dish.rc out of step)" }
          $minSupported = (Get-Content packaging/update-policy.json -Raw | ConvertFrom-Json).minimumSupportedVersion
          if ($minSupported -notmatch '^\d+\.\d+\.\d+$') { throw 'update-policy.json minimumSupportedVersion malformed' }
          $assets = [ordered]@{}
          foreach ($name in @('dish-setup.exe','dish-windows.zip')) {
            $f = Get-Item $name
            $assets[$name] = [ordered]@{
              url    = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
              sha256 = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              size   = $f.Length
            }
          }
          $m = [ordered]@{
            schema = 1; product = 'dish-windows'; version = $version; channel = 'stable'
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
            minimumSupportedVersion = $minSupported
            releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
            assets = $assets
          }
          $json = ($m | ConvertTo-Json -Depth 4) -replace "`r`n", "`n"
          [IO.File]::WriteAllText("$PWD/latest.json", $json + "`n", (New-Object Text.UTF8Encoding $false))
          Get-Content latest.json
          "stable=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      # The harden workflow (Grype, SBOMs, SHA256SUMS across every asset,
      # cosign) and the publish job downstream consume this artifact; the
      # release-asset SHA256SUMS the old pipeline hand-rolled now comes from
      # harden, covering the SBOMs and provenance too.
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-bundle
          # latest.json exists only for stable tags; the unmatched pattern on
          # a prerelease is a warning, not a failure, as long as the others
          # match.
          path: |
            dish-windows.zip
            dish-setup.exe
            latest.json
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # harden: the shared reusable (scan, SBOMs, SHA256SUMS, cosign keyless).
  # Canonical copy: TinkerNorth/satellite/.github/workflows/_release_harden.yml
  # ─────────────────────────────────────────────────────────────────────
  harden:
    name: Harden artifacts
    needs: [release]
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: windows-*
      product: dish-windows

  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: dish-windows.intoto.jsonl
      upload-assets: false
      # A SHA-pinned call cannot resolve the prebuilt builder's release, so
      # the binary never downloads and the generator dies at exit 127; build
      # it from source instead.
      compile-generator: true

  # Publishes on both triggers. `tag_name` is explicit because on
  # workflow_dispatch github.ref is the default branch, not the tag that
  # was built, and action-gh-release would otherwise create a release
  # against the branch ref.
  #
  # draft: true is load-bearing. GitHub never points releases/latest at a
  # draft, so the assets upload while the update permalink still resolves
  # to the previous release; the flip below is what makes publication
  # atomic for every client polling latest.json.
  publish:
    name: Publish to GitHub Releases
    needs: [harden, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      - name: Publish GitHub Release (as draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          draft: true
          files: release/**/*
          fail_on_unmatched_files: true

      # Assets upload while the release is a draft (drafts are never 'latest');
      # flipping afterwards makes the publish atomic for the update permalink.
      - name: Flip release from draft to published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [ "$draft" = "false" ] || { echo "::error::release is still a draft"; exit 1; }
