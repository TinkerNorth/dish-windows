name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Builds a release `dish.exe` + Qt runtime bundle and uploads it to the
# GitHub Releases page for the tag.
#
# This Windows release pipeline starts intentionally smaller than the
# dish-linux one (which produces .deb / AppImage with cosign keyless sigs,
# SBOMs, and SLSA L3 provenance). Once the basic exe-bundle flow is
# proven to ship, the dish-linux `harden` job structure can be ported
# wholesale — see HANDOFF.md item 6.
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout                @ v6.0.2  → de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/upload-artifact         @ v7.0.1  → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   anchore/sbom-action             @ v0.24.0 → e22c389904149dbc22b58101806040fa8d37a610
#   softprops/action-gh-release     @ v3.0.0  → b4309332981a82ec1c5618f44dd2e27cc8bfbfda
#   ilammy/msvc-dev-cmd             @ v1.13.0 → 0b201ec74fa43914dc39ae48a89fd1d8cb592756
#   jurplel/install-qt-action       @ v4.3.1  → 48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
#   lukka/run-vcpkg                 @ v11.5   → 5e0cab206a5ea620130caf672fce3e4a6b5666a1

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: false
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  release:
    name: Build Windows release
    needs: [gates]
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      VCPKG_COMMITID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QT_VERSION: "6.7.3"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""
          cache: true

      - name: Set up vcpkg + install dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMITID }}

      - name: Configure (Release)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDISH_BUILD_TESTS=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      # --parallel 4 matches the windows-2022 runner's 4 vCPUs; Ninja's
      # cores+2 default only oversubscribes the box.
      - name: Build
        run: cmake --build build --parallel 4 --target Dish

      - name: Bundle Qt runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dish-windows | Out-Null
          Copy-Item build/dish.exe dish-windows/
          # jurplel/install-qt-action v4 sets QT_ROOT_DIR (the install root) but
          # NOT Qt6_DIR — the old "$env:Qt6_DIR/../../../bin" spelling resolved
          # against an empty variable, so this step had never worked. It had
          # never been caught because release.yml only fires on a v* tag and no
          # tag has been pushed yet; windows-ci.yml already resolves the
          # documented-correct way.
          # --qmldir walks our QML sources so the Quick modules the app imports
          # (QtQuick, Controls Basic, Layouts, Effects, Window) ship too. The
          # frameless Quick chrome is the ONLY UI, so a QML-less bundle would
          # open to a white window.
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --qmldir src/qml dish-windows/dish.exe

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dish-windows
          format: spdx-json
          artifact-name: dish-windows-sbom.spdx.json
          output-file: dish-windows.spdx.json

      - name: Compute SHA256SUMS
        shell: pwsh
        run: |
          Get-ChildItem dish-windows -Recurse -File |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -FilePath dish-windows/SHA256SUMS -Encoding ascii

      - name: Zip release bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dish-windows/* -DestinationPath dish-windows.zip -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dish-windows-x86_64
          path: |
            dish-windows.zip
            dish-windows.spdx.json
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dish-windows.zip
            dish-windows.spdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
