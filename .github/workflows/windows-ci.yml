name: Windows CI

# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout         @ v6.0.2  → de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/setup-python     @ v6.2.0  → a309ff8b426b58ec0e2a45f0f869d46889d02405
#   actions/upload-artifact  @ v7.0.1  → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   ilammy/msvc-dev-cmd       @ v1.13.0 → 0b201ec74fa43914dc39ae48a89fd1d8cb592756
#   jurplel/install-qt-action @ v4.3.1  → 48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
#   lukka/run-vcpkg           @ v11.5   → 5e0cab206a5ea620130caf672fce3e4a6b5666a1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test, lint, format
    runs-on: windows-2022

    env:
      # vcpkg manifest mode: lukka/run-vcpkg will read vcpkg.json and install
      # libsodium + SDL2. Pin the vcpkg commit so dependency versions are
      # reproducible across CI runs. 6f29f12... is the 2025.01.13 release tag.
      VCPKG_COMMITID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
      # Force vcpkg to use the x64-windows triplet (Qt is dynamic on Windows
      # by default, so keep ABI consistent).
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QT_VERSION: "6.7.3"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""
          cache: true

      - name: Set up vcpkg + install dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMITID }}

      - name: Set up Python (for pinned clang-format)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Match dish-linux / dish-mac / dish-android pin: Ubuntu's clang-format
      # 18 disagrees with brew's 22.x on braced-init lists, so we pull the
      # matching wheel from PyPI to keep all four repos in sync.
      - name: Install clang-format (pinned 22.1.4)
        run: pipx install clang-format==22.1.4

      - name: clang-format (check only)
        shell: pwsh
        run: |
          $files = git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h'
          clang-format --dry-run --Werror $files

      - name: Configure (Debug, tests + QML UI on)
        shell: pwsh
        run: |
          # DISH_QML=ON so the Qt Quick tree (the Dish.Chrome module, the chrome
          # C++, the QmlEntryPoint) actually compiles in CI alongside the tests.
          # The SHIPPED default stays the Widgets UI: the Release/artifact build
          # below deliberately does not set DISH_QML — flipping the product
          # default is the owner's call, not CI's.
          # EXPORT_COMPILE_COMMANDS so the clang-tidy step can reuse this tree
          # instead of configuring and building a second one.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DDISH_BUILD_TESTS=ON `
            -DDISH_QML=ON `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --parallel

      # Lint the Qt Quick sources. Runs after the Debug build because the
      # Dish.Chrome module's qmldir/qmltypes are generated into build/ by
      # qt_add_qml_module — importing pages resolve against them (-I build).
      # Every category gates, with ONE documented downgrade:
      #   * unqualified — `App`, a runtime context property the linter cannot
      #     see (QML_CONTRACT.md documents it as the accepted limitation until
      #     App becomes a compiled singleton).
      # unresolved-type needs no exception: the module declares
      # DEPENDENCIES QtQuick, so Theme's QColor properties resolve statically.
      - name: qmllint (QML static analysis)
        shell: pwsh
        run: |
          # git's * crosses directory levels, so this catches the top-level
          # Main/AppShell/WindowTitleBar too ('src/qml/**/*.qml' would not).
          $files = git ls-files 'src/qml/*.qml'
          & "$env:QT_ROOT_DIR/bin/qmllint.exe" `
            -I build `
            -I "$env:QT_ROOT_DIR/qml" `
            --unqualified info `
            $files

      - name: clang-tidy
        shell: pwsh
        run: |
          # Reuse the Debug tree instead of configuring + building a second one:
          # it already exports compile_commands.json, is DISH_QML=ON (so the
          # src/qml TUs carry real Qt6::Qml include dirs rather than a sibling
          # TU's interpolated command), and is already built, so the generated
          # mocs clang-tidy needs exist. DISH_BUILD_TESTS only gates
          # add_subdirectory(tests) and adds no compile definitions, so the
          # src/*.cpp entries are identical to the old tests-off tidy tree.
          # Only run clang-tidy on .cpp files. Headers are analyzed
          # transitively via HeaderFilterRegex in .clang-tidy. Passing
          # .h files directly trips clang-diagnostic-pragma-once-outside-header
          # because the header has no enclosing translation unit.
          # --extra-arg-before=-Wno-unused-command-line-argument silences
          # clang's complaints about MSVC-style flags (/Zc:preprocessor,
          # /utf-8 etc.) that CMake puts into compile_commands.json when
          # the configure step picks up MSVC cl.exe on PATH; clang-tidy
          # uses the GNU-style clang driver and would otherwise treat
          # them as fatal under the project's -Werror equivalent.
          $files = git ls-files 'src/*.cpp' | Where-Object { $_ -notlike 'src/UI/*' }
          foreach ($f in $files) {
            clang-tidy -p build --quiet `
              --extra-arg-before=-Wno-unused-command-line-argument `
              $f
          }

      - name: Configure (Release)
        shell: pwsh
        run: |
          cmake -S . -B build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDISH_BUILD_TESTS=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build release binary
        run: cmake --build build-release --parallel --target Dish

      - name: Stage release artifact (exe + Qt runtime DLLs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build-release/dish.exe artifact/
          # windeployqt copies every required Qt DLL + plugins next to the exe.
          # jurplel/install-qt-action v4 sets QT_ROOT_DIR (the install root,
          # e.g. ...\Qt\6.7.3\msvc2019_64) but not Qt6_DIR, so resolve
          # windeployqt directly under QT_ROOT_DIR/bin.
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations artifact/dish.exe

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dish-windows-x86_64
          path: artifact
          retention-days: 14
