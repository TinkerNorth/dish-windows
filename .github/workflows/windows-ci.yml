name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here writes to the repo; the artifact upload goes through
# the Actions API, not the contents scope. Declared explicitly so the token
# does not inherit whatever the repository's default workflow permission is.
permissions:
  contents: read

jobs:
  ci:
    name: Build, test, lint, format
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      # vcpkg 2026.07.29. Pinned so dependency versions are reproducible;
      # must match builtin-baseline in vcpkg.json. Keep this pin young: msys2
      # purges superseded packages from its mirrors, so a stale pin's
      # from-source libsodium build starts 404ing once the binary cache
      # evicts (that took the 2025.01.13 pin down in Aug 2026).
      VCPKG_COMMITID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      # Qt ships dynamic on Windows; match it or the ABI diverges.
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QT_VERSION: "6.7.3"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""
          cache: true

      - name: Set up vcpkg + install dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMITID }}

      - name: Set up Python (for pinned clang-format)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Version-pinned from PyPI, not the runner image: clang-format 18 and
      # 22.x disagree on braced-init lists, so an unpinned check flaps.
      - name: Install clang-format (pinned 22.1.4)
        run: pipx install clang-format==22.1.4

      - name: clang-format (check only)
        shell: pwsh
        run: |
          $files = git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h'
          clang-format --dry-run --Werror $files

      - name: Configure (Debug, tests)
        shell: pwsh
        run: |
          # CMAKE_EXPORT_COMPILE_COMMANDS is explicit because the clang-tidy
          # step below lints against this tree's compile_commands.json.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DDISH_BUILD_TESTS=ON `
            -DDISH_REQUIRE_TRANSLATIONS=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      # 4 = the windows-2022 runner's vCPU count. Ninja's cores+2 default
      # oversubscribes it and raises MSVC peak memory for no wall-clock gain.
      - name: Build
        run: cmake --build build --parallel 4

      # ctest --parallel defaults to the processor count, so it is left
      # unbounded on purpose — this is test, not compile, concurrency.
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --parallel

      # Must run after Build: qt_add_qml_module generates the Dish.Chrome
      # qmldir/qmltypes into build/, which importing pages resolve against.
      # Every category gates except `unqualified`, downgraded to info because
      # `App` is a runtime context property the linter cannot see.
      - name: qmllint (QML static analysis)
        shell: pwsh
        run: |
          # git's * crosses directory levels; 'src/qml/**/*.qml' would miss
          # the top-level Main/AppShell/WindowTitleBar.
          $files = git ls-files 'src/qml/*.qml'
          & "$env:QT_ROOT_DIR/bin/qmllint.exe" `
            -I build `
            -I "$env:QT_ROOT_DIR/qml" `
            --unqualified info `
            $files

      # qmllint checks a QML file RESOLVES; this checks it used the design
      # tokens. A hard-coded `#4FE3FF` or `radius: 8` still renders, it just
      # stops tracking the palette — no other gate would catch it.
      - name: QML literal scanner
        shell: pwsh
        run: ./scripts/qml-lint-literals.ps1 -Mode error

      # A stale .ts is not a compile error, so nothing else catches a string
      # added without a catalogue entry.
      - name: Translation catalogues in sync
        shell: pwsh
        run: ./scripts/check-translations.ps1

      # Must run after Build: reuses that tree's compile_commands.json and
      # needs the generated mocs to exist.
      - name: clang-tidy
        shell: pwsh
        run: |
          # .cpp only — headers are covered transitively via HeaderFilterRegex,
          # and passing a .h directly trips
          # clang-diagnostic-pragma-once-outside-header.
          # -Wno-unused-command-line-argument: compile_commands.json carries
          # MSVC-style flags (/Zc:preprocessor, /utf-8) that the GNU-style
          # clang driver would otherwise reject.
          $files = git ls-files 'src/*.cpp' | Where-Object { $_ -notlike 'src/UI/*' }
          foreach ($f in $files) {
            clang-tidy -p build --quiet `
              --extra-arg-before=-Wno-unused-command-line-argument `
              $f
          }

      - name: Configure (Release)
        shell: pwsh
        run: |
          cmake -S . -B build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDISH_BUILD_TESTS=OFF `
            -DDISH_REQUIRE_TRANSLATIONS=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      # dish_setup_image stages the install image (windeployqt + the app-local
      # CRT + licences); installer.iss ships it verbatim in the iscc step below.
      - name: Build release binary
        run: cmake --build build-release --parallel 4 --target Dish dish_setup_image

      - name: Stage release artifact (exe + Qt runtime DLLs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build-release/dish.exe artifact/
          # windeployqt walks Qt's dependency graph only. dish.exe imports
          # libsodium.dll and SDL2.dll directly, so without this copy the
          # artifact ships a dish.exe that cannot start (0xc0000135).
          Copy-Item build-release/libsodium.dll, build-release/SDL2.dll artifact/
          # --qmldir is required: the Quick chrome is the only UI, so an
          # artifact without the QML modules opens to a white window.
          # install-qt-action v4 sets QT_ROOT_DIR but not Qt6_DIR.
          #
          # --no-compiler-runtime, with the CRT staged by hand below: what
          # windeployqt otherwise deploys is vc_redist.x64.exe, an installer
          # rather than a runtime, which leaves the artifact unable to start on
          # any machine that has not already had it run. Same call, and the same
          # five files, as cmake/DishSetupImage.cmake section 6.
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-compiler-runtime --qmldir src/qml artifact/dish.exe
          # dish.exe imports MSVCP140, VCRUNTIME140 and VCRUNTIME140_1 directly;
          # Qt6Core adds MSVCP140_1 and MSVCP140_2. VCToolsRedistDir comes from
          # the MSVC environment step, and its absence is fatal here for the
          # reason it is fatal in the install image: the alternative is an
          # artifact that borrows the runner's System32 and dies elsewhere.
          if (-not $env:VCToolsRedistDir) { throw 'VCToolsRedistDir is not set: the MSVC environment step did not run, and the artifact cannot ship an app-local CRT' }
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path $crt $dll))) { throw "Missing $dll in $crt" }
            Copy-Item (Join-Path $crt $dll) artifact/
          }
          # The app's OWN QML module entry. windeployqt deploys the QT modules
          # the imports resolve to, and Dish.Chrome is not one of Qt's. dish.exe
          # carries a compiled-in copy, but Qt searches <exedir>/Dish/Chrome/qmldir
          # BEFORE it, so the file that ships had better be the app's own. The
          # asserts name a regression here rather than leave it to the smoke
          # test below. Same staging as release.yml and
          # cmake/DishSetupImage.cmake section 3.
          $qmldir = 'build-release/Dish/Chrome/qmldir'
          if (-not (Test-Path $qmldir)) { throw "No Dish.Chrome qmldir at $qmldir - the staged dish.exe could not resolve its own QML module" }
          if ((Get-Content $qmldir -Raw) -notmatch '(?m)^Main 1\.0 ') { throw "$qmldir does not declare the app's Main type, so it is the wrong Dish.Chrome qmldir (the setup kit's?)" }
          New-Item -ItemType Directory -Force -Path artifact/Dish/Chrome | Out-Null
          Copy-Item $qmldir artifact/Dish/Chrome/

      # The one gate that runs the deployed app instead of the build tree.
      # Everything else here — ctest, qmllint, the installer round-trip — passes
      # against a dish.exe sitting in its build directory, which is precisely
      # where a missing deployment file cannot be noticed.
      - name: Portable bundle smoke test (it must start)
        shell: pwsh
        run: ./scripts/test-portable-bundle.ps1 -Bundle artifact

      # Compiling the .iss on every PR is what catches a broken installer
      # before a release does. Same recipe as release.yml and satellite.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          # The version comes from the same project(Dish VERSION ...) line
          # release.yml asserts the tag against.
          $cm = Get-Content CMakeLists.txt -Raw
          if ($cm -notmatch 'project\(\s*Dish[\s\r\n]+VERSION[\s]+(\d+\.\d+\.\d+)') { throw 'project VERSION not found in CMakeLists.txt' }
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$($Matches[1])" "/DImageDir=build-release\setup-image" installer.iss
          if (-not (Test-Path 'dist/dish-setup.exe')) { throw 'iscc did not produce dist/dish-setup.exe' }

      # Installs, repairs and uninstalls the compiled installer, all silent and
      # all asserted against a real disk and a real HKCU — including the
      # unins*.exe sibling the app's installed-vs-portable probe looks for.
      - name: Installer silent round-trip (no UI)
        shell: pwsh
        run: ./scripts/test-installer-roundtrip.ps1 -Setup dist/dish-setup.exe

      # After the round-trip, so a failed installer never reaches the artifact.
      # Copied INTO artifact/ rather than listed as a second upload path: a
      # second path would make upload-artifact preserve both directory names
      # and push dish.exe down a level, silently changing the layout every
      # existing consumer of this artifact unpacks.
      - name: Stage installer beside the portable bundle
        shell: pwsh
        run: Copy-Item dist/dish-setup.exe artifact/

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dish-windows-x86_64
          path: artifact
          retention-days: 14
