name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here writes to the repo; the artifact upload goes through
# the Actions API, not the contents scope. Declared explicitly so the token
# does not inherit whatever the repository's default workflow permission is.
permissions:
  contents: read

jobs:
  ci:
    name: Build, test, lint, format
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      # vcpkg 2026.07.29. Pinned so dependency versions are reproducible;
      # must match builtin-baseline in vcpkg.json. Keep this pin young: msys2
      # purges superseded packages from its mirrors, so a stale pin's
      # from-source libsodium build starts 404ing once the binary cache
      # evicts (that took the 2025.01.13 pin down in Aug 2026).
      VCPKG_COMMITID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      # Qt ships dynamic on Windows; match it or the ABI diverges.
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QT_VERSION: "6.7.3"
      # Job-level so lukka/run-vcpkg sees it already defined and leaves it
      # alone: its default (clear;x-gha,readwrite) has never restored a
      # package here, so both configures rebuilt OpenSSL from source (~7 min
      # each) on every run. The files provider is backed by the actions/cache
      # step below; codeql.yml uses the same key, so the two lanes share
      # archives.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""
          cache: true

      # ImageVersion is in the cache key because a runner-image update can
      # carry a new MSVC, which changes vcpkg's ABI hashes: under a fixed key
      # the cache would go permanently stale — restored but never hit, rebuilt
      # but never saved, since actions/cache does not update an existing key.
      # The directory must exist before vcpkg first writes into it.
      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          Add-Content $env:GITHUB_ENV "IMAGE_VERSION=$env:ImageVersion"

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ env.VCPKG_COMMITID }}-${{ hashFiles('vcpkg.json') }}
          # A pin or manifest bump still restores the previous archives: vcpkg
          # keys each package by ABI hash, skips what no longer matches, and
          # rebuilds only the delta, saved under the new key.
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Set up vcpkg + install dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMITID }}

      - name: Set up Python (for pinned clang-format)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Version-pinned from PyPI, not the runner image: clang-format 18 and
      # 22.x disagree on braced-init lists, so an unpinned check flaps.
      - name: Install clang-format (pinned 22.1.4)
        run: pipx install clang-format==22.1.4

      # The gate itself lives in scripts/check-format.ps1 so this workflow and
      # scripts/ci-local.ps1 cannot drift on the file set or the invocation.
      - name: clang-format (check only)
        shell: pwsh
        run: ./scripts/check-format.ps1

      # The configure line lives in CMakePresets.json (preset debug: Ninja,
      # tests, translations required, compile_commands.json for the clang-tidy
      # step below) so this workflow and scripts/build.ps1 /
      # scripts/ci-local.ps1 run the identical build.
      - name: Configure (Debug, tests)
        shell: pwsh
        run: cmake --preset debug

      # 4 = the windows-2022 runner's vCPU count. Ninja's cores+2 default
      # oversubscribes it and raises MSVC peak memory for no wall-clock gain.
      - name: Build
        run: cmake --build --preset debug --parallel 4

      # ctest --parallel defaults to the processor count, so it is left
      # unbounded on purpose — this is test, not compile, concurrency.
      - name: Run tests
        run: ctest --preset debug --parallel

      # Must run after Build: qt_add_qml_module generates the Dish.Chrome
      # qmldir/qmltypes into build/, which importing pages resolve against.
      # File set and flags live in scripts/check-qml.ps1, shared with
      # scripts/ci-local.ps1.
      - name: qmllint (QML static analysis)
        shell: pwsh
        run: ./scripts/check-qml.ps1 -BuildDir build

      # qmllint checks a QML file RESOLVES; this checks it used the design
      # tokens. A hard-coded `#4FE3FF` or `radius: 8` still renders, it just
      # stops tracking the palette — no other gate would catch it.
      - name: QML literal scanner
        shell: pwsh
        run: ./scripts/qml-lint-literals.ps1 -Mode error

      # A stale .ts is not a compile error, so nothing else catches a string
      # added without a catalogue entry.
      - name: Translation catalogues in sync
        shell: pwsh
        run: ./scripts/check-translations.ps1

      # Must run after Build: reuses that tree's compile_commands.json and
      # needs the generated mocs to exist. File set, flags, and the four-wide
      # parallel recipe (with its stderr-folding rationale) live in
      # scripts/check-tidy.ps1, shared with scripts/ci-local.ps1.
      - name: clang-tidy
        shell: pwsh
        run: ./scripts/check-tidy.ps1 -BuildDir build

      # The configure line lives in CMakePresets.json (preset release).
      - name: Configure (Release)
        shell: pwsh
        run: cmake --preset release

      # The release build preset carries the Dish + dish_setup_image targets:
      # dish_setup_image stages the install image (windeployqt + the app-local
      # CRT + licences); installer.iss ships it verbatim in the iscc step below.
      - name: Build release binary
        run: cmake --build --preset release --parallel 4

      # One staging path for this artifact and release.yml's portable zip:
      # scripts/stage-bundle.ps1 (exe, the four directly-imported DLLs
      # libcrypto included, windeployqt, app-local CRT, Dish.Chrome qmldir,
      # licence texts). The two lanes used to stage by hand and drifted:
      # release.yml's zip shipped without libcrypto-3-x64.dll.
      - name: Stage release artifact (exe + Qt runtime DLLs)
        shell: pwsh
        run: ./scripts/stage-bundle.ps1 -BuildDir build-release -OutDir artifact

      # The one gate that runs the deployed app instead of the build tree.
      # Everything else here — ctest, qmllint, the installer round-trip — passes
      # against a dish.exe sitting in its build directory, which is precisely
      # where a missing deployment file cannot be noticed.
      - name: Portable bundle smoke test (it must start)
        shell: pwsh
        run: ./scripts/test-portable-bundle.ps1 -Bundle artifact

      # Compiling the .iss on every PR is what catches a broken installer
      # before a release does. Same recipe as release.yml and satellite.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      # scripts/build-installer.ps1 reads the version from the same
      # project(Dish VERSION ...) line release.yml asserts the tag against,
      # packs build-release\setup-image, and fails if dist/dish-setup.exe is
      # not produced.
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: ./scripts/build-installer.ps1 -BuildDir build-release

      # Installs, repairs and uninstalls the compiled installer, all silent and
      # all asserted against a real disk and a real HKCU — including the
      # unins*.exe sibling the app's installed-vs-portable probe looks for.
      - name: Installer silent round-trip (no UI)
        shell: pwsh
        run: ./scripts/test-installer-roundtrip.ps1 -Setup dist/dish-setup.exe

      # After the round-trip, so a failed installer never reaches the artifact.
      # Copied INTO artifact/ rather than listed as a second upload path: a
      # second path would make upload-artifact preserve both directory names
      # and push dish.exe down a level, silently changing the layout every
      # existing consumer of this artifact unpacks.
      - name: Stage installer beside the portable bundle
        shell: pwsh
        run: Copy-Item dist/dish-setup.exe artifact/

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dish-windows-x86_64
          path: artifact
          retention-days: 14
