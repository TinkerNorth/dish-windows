name: Security

# Security gates on every pull request, every push to main and weekly. The jobs live in the
# shared _security.yml (action-pin lint, allowlist expiry, OSV-Scanner, dependency review,
# gitleaks), a byte-identical copy of satellite's; CodeQL lives in codeql.yml because it has its
# own matrix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shared:
    # Exactly what _security.yml declares; a narrower grant fails the call at startup.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: .
      # OSV-Scanner reads no vcpkg manifest, so the libraries dish.exe links are named by the
      # upstream commit their pins resolve to: every vcpkg port at the baseline, ENet, Qt.
      osv_lockfile_script: scripts/osv-lockfile.sh
      # The repository's Dependency graph setting is off, and the action fails without it.
      # Switching it on (Settings, Code security, Dependency graph) is the maintainer's call;
      # then this becomes true and the job blocks.
      dependency_review_enabled: false
